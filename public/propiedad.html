<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de Propiedad · Fincas Maricel</title>
    <link rel="icon" type="image/png" href="assets/cropped-Icon-Circle-scaled-1.png" />
    <meta
      name="description"
      content="Ficha completa de inmueble en Sitges y alrededores · Fincas Maricel desde 1979."
    />

    <!-- Tipografías Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body data-page="compre">
    <!-- Header externo -->
    <div id="header-placeholder"></div>

    <main id="main-content" class="property-detail-page">
      <div class="property-detail-container" id="property-detail-root">
        <p class="catalog-empty">Cargando ficha del inmueble...</p>
      </div>
    </main>

    <!-- Footer externo -->
    <div id="footer-placeholder"></div>

    <!-- Botón flotante volver arriba -->
    <button
      type="button"
      class="scroll-top-btn"
      id="scroll-top-btn"
      aria-label="Volver arriba"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path
          d="M12 18V6M6 12l6-6 6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/components.js"></script>
    <script src="js/properties-store.js"></script>
    <script src="js/property-detail.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
