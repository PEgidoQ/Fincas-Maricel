[build]
  publish = "public"
  command = "node scripts/build-i18n-pages.mjs && node scripts/sync-inmoweb.mjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/data/properties.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
